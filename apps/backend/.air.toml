root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql", "env", "yaml"]
  exclude_dir = ["tmp", "bin", "docs", "vendor", "testdata", ".git"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  log = "build-errors.log"
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
