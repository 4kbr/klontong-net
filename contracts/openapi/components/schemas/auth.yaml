# Schema modul identity (auth) — bentuk request/response area /api/v1/auth dan /api/v1/me.

RegisterRequest:
  type: object
  required: [email, phone, password, full_name]
  properties:
    email:
      type: string
      format: email
      description: Dinormalisasi lowercase oleh server.
      example: budi@example.com
    phone:
      type: string
      description: Dinormalisasi ke E.164 oleh server.
      example: "081234567890"
    password:
      type: string
      format: password
      minLength: 8
      example: rahasia-kuat-123
    full_name:
      type: string
      example: Budi Santoso
  additionalProperties: false

LoginRequest:
  type: object
  required: [identifier, password]
  properties:
    identifier:
      type: string
      description: Email ATAU nomor telepon dalam satu field.
      example: budi@example.com
    password:
      type: string
      format: password
      example: rahasia-kuat-123
  additionalProperties: false

RefreshRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      example: 6f9d...c1a2
  additionalProperties: false

LogoutRequest:
  type: object
  properties:
    all_sessions:
      type: boolean
      default: false
      description: Bila true, cabut semua sesi milik pengguna.
  additionalProperties: false

VerifyEmailRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string
      example: verif_8b1c2d3e
  additionalProperties: false

RequestOtpRequest:
  type: object
  required: [phone]
  properties:
    phone:
      type: string
      example: "081234567890"
  additionalProperties: false

VerifyOtpRequest:
  type: object
  required: [phone, code]
  properties:
    phone:
      type: string
      example: "081234567890"
    code:
      type: string
      pattern: '^\d{4,8}$'
      example: "482913"
  additionalProperties: false

ForgotPasswordRequest:
  type: object
  required: [identifier]
  properties:
    identifier:
      type: string
      description: Email atau nomor telepon. Response selalu sukses (tidak membocorkan keberadaan akun).
      example: budi@example.com
  additionalProperties: false

ResetPasswordRequest:
  type: object
  required: [token, new_password]
  properties:
    token:
      type: string
      example: reset_2a4c6e8f
    new_password:
      type: string
      format: password
      minLength: 8
      example: sandi-baru-456
  additionalProperties: false

ChangePasswordRequest:
  type: object
  required: [current_password, new_password]
  properties:
    current_password:
      type: string
      format: password
    new_password:
      type: string
      format: password
      minLength: 8
  additionalProperties: false

TokenPair:
  type: object
  description: >-
    Access token JWT (TTL 15 menit) + refresh token (disimpan hashed di server,
    dirotasi setiap dipakai).
  required: [access_token, refresh_token, token_type, expires_in]
  properties:
    access_token:
      type: string
      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    refresh_token:
      type: string
      example: 6f9d0b7a1c2e3f4a5b6c7d8e9f0a1b2c
    token_type:
      type: string
      enum: [Bearer]
      example: Bearer
    expires_in:
      type: integer
      description: Umur access token dalam detik.
      example: 900

AuthUser:
  type: object
  description: Ringkasan akun setelah login/register.
  required: [id, email, roles, email_verified, phone_verified, created_at]
  properties:
    id:
      $ref: "./_common.yaml#/Uuid"
    email:
      type: string
      format: email
    phone:
      type: string
    full_name:
      type: string
    roles:
      type: array
      items:
        type: string
        enum: [buyer, seller, admin]
      example: [buyer]
    email_verified:
      type: boolean
    phone_verified:
      type: boolean
    created_at:
      $ref: "./_common.yaml#/Timestamp"

AuthSession:
  type: object
  description: Hasil login/register — user + token.
  required: [user, tokens]
  properties:
    user:
      $ref: "#/AuthUser"
    tokens:
      $ref: "#/TokenPair"

UpdateProfileRequest:
  type: object
  properties:
    full_name:
      type: string
    birth_date:
      type: string
      format: date
      nullable: true
    gender:
      type: string
      enum: [male, female, unspecified]
      nullable: true
  additionalProperties: false
