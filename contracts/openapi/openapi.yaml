  /api/v1/suborders/{suborderId}/confirm-received: { $ref: "./paths/orders.yaml#/confirmReceived" }

  # --- Reviews ---
  /api/v1/reviews: { $ref: "./paths/reviews.yaml#/collection" }
  /api/v1/reviews/{reviewId}: { $ref: "./paths/reviews.yaml#/item" }
  /api/v1/reviews/{reviewId}/report: { $ref: "./paths/reviews.yaml#/report" }
  /api/v1/me/reviews: { $ref: "./paths/reviews.yaml#/myReviews" }

  # --- Notifications ---
  /api/v1/notifications: { $ref: "./paths/notifications.yaml#/collection" }
  /api/v1/notifications/unread-count: { $ref: "./paths/notifications.yaml#/unreadCount" }
  /api/v1/notifications/read-all: { $ref: "./paths/notifications.yaml#/readAll" }
