openapi: 3.0.3

info:
  title: Klontong Net API
  version: 0.2.0
  description: |
    Kontrak API marketplace Klontong Net. **Contract-first**: dokumen ini ditulis
    sebelum implementasi dan menjadi sumber kebenaran bentuk API untuk backend
    (`apps/backend`) dan frontend (`apps/frontend`).

    OpenAPI **3.0.3** dipilih (bukan 3.1) demi dukungan tooling yang lebih luas
    untuk mock (Prism) dan codegen; `nullable: true` dipakai sesuai idiom 3.0.

    ## Cakupan
    Seluruh API:
    - **Pembeli** `/api/v1/*` (publik & terautentikasi): auth, profil & alamat,
      katalog & pencarian, keranjang, ongkir, voucher, checkout dua tahap, pesanan
      & pembayaran, ulasan, notifikasi.
    - **Penjual** `/api/v1/seller/*`: toko, outlet, pengelola, dokumen, produk &
      varian, harga & tier, stok & opname, pengiriman & zona antar, voucher toko,
      siklus suborder, ulasan, saldo & pencairan.
    - **Admin** `/api/v1/admin/*`: verifikasi toko, kategori, voucher marketplace,
      pesanan, pembayaran & rekonsiliasi, refund, settlement & payout, audit.
    - **Webhook** `/webhook/*`: notifikasi pembayaran gateway.

    ## Konvensi
    - **Envelope sukses**: `{ "data": <T>, "meta": <Meta> }`.
    - **Envelope error**: `{ "error": { "code", "message", "fields"?, "retryable"? } }`.
      `code` machine-stable, `lower_snake_case`, spesifik.
    - **Paginasi**: keyset. `?limit` + `?cursor` (opaque). Response `meta.next_cursor`
      + `meta.has_more`. Bukan offset.
    - **Uang**: `integer` (int64) rupiah, selalu angka. Persen = basis poin.
    - **Header**: `Authorization: Bearer <jwt>`; `Idempotency-Key` wajib di
      `POST /api/v1/checkout`; `X-Request-ID` di echo semua response.
    - **ADR-004**: request checkout tidak memuat field harga/total. Klien mengirim
      pilihan; `client_grand_total` hanya pembanding pemicu `price_changed`.
    - **Order** selalu order induk + array suborder dengan status masing-masing.

    ## Catatan ketidaksesuaian scaffold
    - `order` routes memakai `/api/v1/seller/orders/{suborderId}` (M2); task doc 12
      menulis `.../suborders/{id}`. Kontrak mengikuti `routes.go`.
    - `GET /products/{slug}` vs `GET /products/{productId}/reviews` campur slug/id —
      didokumentasikan apa adanya, diseragamkan saat implementasi.
  contact:
    name: Tim Klontong Net
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Lokal (API dev)
  - url: http://localhost:4010
    description: Mock Prism dari kontrak ini
  - url: https://api.klontong.example
    description: Produksi (placeholder)

tags:
  - name: Auth
    description: Registrasi, login, sesi, verifikasi, reset kata sandi.
  - name: Account
    description: Profil pengguna dan alamat pengiriman.
  - name: Catalog
    description: Penelusuran produk publik, kategori, halaman toko publik.
  - name: Cart
    description: Keranjang belanja, dikelompokkan per penjual.
  - name: Shipping
    description: Perhitungan ongkir per suborder dan tampilan pengiriman untuk pembeli.
  - name: Promotion
    description: Validasi voucher dan daftar voucher yang tersedia.
  - name: Checkout
    description: Alur checkout dua tahap — preview lalu place order.
  - name: Orders
    description: Pesanan pembeli, siklus suborder dari sisi pembeli, status pembayaran.
  - name: Reviews
    description: Ulasan produk oleh pembeli terverifikasi.
  - name: Notifications
    description: Kotak masuk notifikasi dan preferensi.
  - name: Seller Shop
    description: Dasbor penjual — toko, outlet, pengelola, dokumen verifikasi.
  - name: Seller Catalog
    description: Dasbor penjual — produk, varian, gambar, harga, tier grosir.
  - name: Seller Inventory
    description: Dasbor penjual — stok per outlet, mutasi, stok opname.
  - name: Seller Fulfillment
    description: Dasbor penjual — pengiriman dan zona antar lokal.
  - name: Seller Promotion
    description: Dasbor penjual — voucher milik toko.
  - name: Seller Orders
    description: Dasbor penjual — siklus suborder (konfirmasi, kemas, kirim, tolak).
  - name: Seller Finance
    description: Dasbor penjual — saldo, pendapatan, pencairan.
  - name: Seller Reviews
    description: Dasbor penjual — ulasan pada produk toko dan balasan.
  - name: Admin
    description: Panel marketplace — verifikasi, kategori, voucher, pesanan, pembayaran, settlement, audit.
  - name: Webhooks
    description: Notifikasi masuk dari penyedia (pembayaran). Tanpa sesi, verifikasi tanda tangan.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [Auth]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server hidup.
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      operationId: readyz
      tags: [Auth]
      summary: Readiness probe
      security: []
      responses:
        "200":
          description: Server siap menerima trafik.
          content:
            text/plain:
              schema:
                type: string
                example: ready
        "503":
          description: Belum siap (DB/Redis belum tersambung).
          content:
            application/json:
              schema:
                $ref: "./components/schemas/_common.yaml#/ErrorEnvelope"

