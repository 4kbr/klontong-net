  /api/v1/orders/{orderId}: { $ref: "./paths/orders.yaml#/item" }
  /api/v1/orders/{orderId}/cancel: { $ref: "./paths/orders.yaml#/cancel" }
  /api/v1/orders/{orderId}/payment: { $ref: "./paths/orders.yaml#/payment" }
